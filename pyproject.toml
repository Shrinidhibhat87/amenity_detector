[project]
name = "amenity-detector"
version = "0.1.0"
description = "End-to-end amenity detection pipeline for property images using vision-language models."
requires-python = ">=3.11"

# ── Runtime dependencies ──────────────────────────────────────────────────────
# Only include libraries that are actually imported in the codebase.
# Anything not yet used (e.g. RAG, vector stores) goes in when the feature lands.
dependencies = [
    # Image handling — PIL used throughout the pipeline
    "Pillow>=9.5.0",

    # Database layer — SQLAlchemy ORM + Alembic migrations + PostgreSQL driver
    "sqlalchemy>=2.0.0",      # ORM: defines Property, Image, DetectedAmenity tables
    "alembic>=1.13.0",        # Schema migrations (run: alembic upgrade head)
    "psycopg2-binary>=2.9.0", # PostgreSQL adapter for SQLAlchemy
    "pgvector>=0.3.0",        # pgvector type + cosine ops for Phase 11 hybrid search

    # API layer — FastAPI + Uvicorn ASGI server (api/)
    "fastapi>=0.115.9",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",  # Required by FastAPI to accept file uploads (multipart/form-data)

    # VLM + HTTP clients
    "openai>=1.30.0",
    "requests>=2.31.0",

    # Data handling
    "pandas>=2.0.0",
    "numpy>=1.25.0",

    # Observability — Phase 4
    # python-json-logger formats all log output as structured JSON so log aggregators
    # (e.g., Loki, CloudWatch) can index individual fields.
    "python-json-logger>=2.0.0",
    # prometheus-fastapi-instrumentator adds a /metrics endpoint to FastAPI with
    # standard HTTP request/response histograms — scraped by Prometheus.
    "prometheus-fastapi-instrumentator>=6.0.0",
]

# ── Development dependencies ──────────────────────────────────────────────────
# Install with: uv sync --group dev
[dependency-groups]
dev = [
    "ruff>=0.4.0",        # Linting + formatting (replaces flake8, black, isort)
    "mypy>=1.10.0",       # Static type checker
    "pre-commit>=3.7.0",  # Git hook manager — runs ruff + mypy before each commit
    "pytest>=8.0.0",      # Test runner
    "httpx>=0.27.0",      # HTTP client used by FastAPI TestClient for integration tests
    "pytest-asyncio>=0.23.0",  # Async test support for FastAPI async endpoints
    "types-requests",     # Type stubs for the `requests` library
    "pandas-stubs",       # Type stubs for pandas
    "sqlalchemy[mypy]",   # mypy plugin for SQLAlchemy mapped_column type inference
]

# ── uv project settings ───────────────────────────────────────────────────────
[tool.uv]
# This project is NOT a Python package to be published on PyPI.
# We just use uv to manage the virtual environment and dependencies.
package = false

# ── Ruff: linting and formatting ──────────────────────────────────────────────
# Ruff replaces flake8, black, isort, and pyupgrade in a single tool.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle style errors (e.g. whitespace issues)
    "W",   # pycodestyle style warnings
    "F",   # pyflakes (e.g. unused imports, undefined names)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modernise syntax for Python 3.11+)
]
ignore = [
    "E501",  # line-too-long — ruff format handles line length, not ruff check
    "B008",  # function call in default argument — FastAPI intentionally uses File(...) and Depends() here
]

[tool.ruff.lint.isort]
# Tell ruff which packages belong to THIS project so imports are sorted correctly.
known-first-party = ["core", "models", "api", "db"]

# ── Mypy: static type checking ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true       # Warn when a function returns Any without being explicit
warn_unused_configs = true   # Catch typos in mypy config
ignore_missing_imports = true  # torch, transformers etc. have incomplete stubs — skip them

# SQLAlchemy mypy plugin — enables type inference for mapped_column() and Mapped[]
plugins = ["sqlalchemy.ext.mypy.plugin"]

# ── Pytest: test runner configuration ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]        # Only look for tests inside the tests/ directory
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
