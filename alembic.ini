# Alembic configuration file.
# This file tells Alembic where to find migration scripts and how to connect to the database.
#
# How to use:
#   Generate a new migration after changing db/models.py:
#       alembic revision --autogenerate -m "add column X to properties"
#
#   Apply all pending migrations:
#       alembic upgrade head
#
#   Roll back the last migration:
#       alembic downgrade -1
#
#   See migration history:
#       alembic history

[alembic]
# Location of the migration scripts (relative to this file)
script_location = db/migrations

# The database URL. In practice, Alembic reads DATABASE_URL from the environment
# via db/migrations/env.py — this value here is only the fallback for CLI usage.
# See db/migrations/env.py for how this is overridden at runtime.
sqlalchemy.url = sqlite:///./amenity_detector.db

# Length of the short revision hash in filenames (default 12 is fine)
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S