# ── Continuous Integration ────────────────────────────────────────────────────
# This workflow runs on every push and pull request to the `main` branch.
# It checks that:
#   1. The code is formatted correctly (ruff format)
#   2. There are no linting errors (ruff check)
#   3. Type annotations are consistent (mypy)
#
# Note: We deliberately do NOT install torch/transformers in CI because they are
# multi-GB downloads that would make CI very slow. Linting and type checking
# only need the dev dependencies (ruff, mypy).
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repo code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install uv — the fast Python package manager we use in this project
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 3: Install only dev dependencies (ruff, mypy, pre-commit, pytest).
      # We skip the main dependencies (torch etc.) because CI doesn't run the model.
      # --no-install-project: don't try to install this repo as a package (it isn't one)
      - name: Install dev dependencies
        run: uv sync --group dev --no-install-project

      # Step 4: Run ruff linter — catches bugs, bad patterns, unsorted imports
      - name: Lint with ruff
        run: uv run ruff check .

      # Step 5: Run ruff formatter in check mode — fails if any file needs reformatting
      # (It does NOT modify files in CI; devs fix this locally via `uv run ruff format .`)
      - name: Check formatting with ruff
        run: uv run ruff format --check .

      # Step 6: Run mypy type checker — catches type mismatches and annotation errors
      - name: Type check with mypy
        run: uv run mypy . --ignore-missing-imports

      # Step 7: Run unit tests — these only depend on dev packages (no torch required).
      # Integration tests that need a real GPU/DB are intentionally excluded from CI.
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v

  web:
    name: Web Lint, Types, and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The version is pinned here because the action otherwise looks for a
      # `packageManager` field in a root package.json, which this repo does not
      # have — the Node project lives in web/.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # The end-to-end specs stub the FastAPI backend at the network boundary,
      # so this job needs a browser but no database and no model provider.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e
