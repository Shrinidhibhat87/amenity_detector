# Docker Compose configuration for the Amenity Detector stack.
#
# Services defined here:
#   db         — PostgreSQL 16 database
#   api        — FastAPI backend (port 8000)
#   web        — Next.js TypeScript frontend (port 3000)
#   prometheus — Metrics scraper (port 9090)
#   grafana    — Dashboards for Prometheus (port 3030)
#
# How to use:
#   Start everything:      docker compose up
#   Start in background:   docker compose up -d
#   Stop everything:       docker compose down
#   Destroy data too:      docker compose down -v    ← WARNING: deletes the database volume
#   Tail API logs:         docker compose logs -f api
#   Open a psql shell:     docker compose exec db psql -U amenity_user amenity_db
#   Open Grafana:          http://localhost:3030  (admin / admin, change on first login)
#
# Volumes:
#   postgres_data   — persists the database between docker compose restarts
#   image_storage   — persists uploaded images between API container restarts
#   grafana_data    — persists Grafana dashboards and data sources

services:

  # ── PostgreSQL 16 + pgvector ──────────────────────────────────────────────
  db:
    # pgvector/pgvector:pg16 = upstream Postgres 16 with the `vector` extension
    # pre-installed. Drop-in replacement for postgres:16 — same data dir layout,
    # so the existing postgres_data volume migrates without action.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # These are read from your .env file (copy from .env.example)
      POSTGRES_USER: ${POSTGRES_USER:-amenity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amenity_pass}
      POSTGRES_DB: ${POSTGRES_DB:-amenity_db}
    ports:
      # Expose PostgreSQL to localhost so you can connect with psql or a DB GUI.
      # Remove this in production to avoid exposing the DB to the internet.
      - "5432:5432"
    volumes:
      # Named volume so data survives container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Docker Compose waits for this to pass before starting dependent services
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amenity_user} -d ${POSTGRES_DB:-amenity_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .               # Build context is the repo root (so COPY works)
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amenity_user}:${POSTGRES_PASSWORD:-amenity_pass}@db:5432/${POSTGRES_DB:-amenity_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IMAGE_STORAGE_DIR: /app/storage/images
      # Locality enrichment (OSM). NOMINATIM_USER_AGENT is required by the
      # Nominatim usage policy; without it the locality endpoints return 503.
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-https://overpass-api.de/api}
      LOCALITY_AGENT_MODEL: ${LOCALITY_AGENT_MODEL:-openai/gpt-4o-mini}
    volumes:
      # Named volume for uploaded images — survives container rebuilds
      - image_storage:/app/storage/images
    depends_on:
      db:
        condition: service_healthy  # Wait until PostgreSQL is accepting connections
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js TypeScript frontend ─────────────────────────────────────────────
  # Runs the standalone Next.js server. Host port 3000 is the Next.js default.
  # The web container itself also listens on 3000 internally.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Internal Docker DNS — the web container reaches the API via the service name.
      API_BASE_URL: http://api:8000
      # Exposed to the browser via Next.js public env. The browser hits the host port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Canonical origin for SEO URLs (sitemap, robots, JSON-LD). Override in
      # production with the real public domain (e.g. https://amenity.example.com).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Prometheus (Phase 4 — metrics scraper) ──────────────────────────────────
  # Prometheus scrapes the FastAPI /metrics endpoint every 15 seconds and stores
  # time-series data for Grafana dashboards.
  # Access: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount our custom scrape config so Prometheus knows which targets to scrape
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # ── Grafana (Phase 4 — dashboards) ─────────────────────────────────────────
  # Grafana visualises the Prometheus metrics.
  # Access: http://localhost:3030  (default credentials: admin / admin)
  # On first login you will be prompted to change the password.
  # To add a Prometheus data source: Settings → Data Sources → Add → Prometheus
  #   URL: http://prometheus:9090
  # Host port 3030 is used because Next.js (web) claims the standard 3000.
  # Grafana itself still listens on 3000 inside the container.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin  # Change this in production!
    volumes:
      # Persist dashboards and data source configs across restarts
      - grafana_data:/var/lib/grafana
      # Auto-provision the Prometheus data source AND the Amenity Detector dashboard
      # so both appear automatically at http://localhost:3000 with no manual setup
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Docker manages this volume; data persists across `docker compose down` (without -v)
  image_storage:
    # Uploaded images; also persists across restarts
  grafana_data:
    # Grafana dashboard configs and data sources; persists across restarts
