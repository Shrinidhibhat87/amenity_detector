# Docker Compose configuration for the Amenity Detector stack.
#
# Services defined here:
#   db       — PostgreSQL 16 database
#   api      — FastAPI backend (port 8000)
#   ui       — Gradio frontend (port 7860) — Phase 3, commented out until then
#
# How to use:
#   Start everything:      docker compose up
#   Start in background:   docker compose up -d
#   Stop everything:       docker compose down
#   Destroy data too:      docker compose down -v    ← WARNING: deletes the database volume
#   Tail API logs:         docker compose logs -f api
#   Open a psql shell:     docker compose exec db psql -U amenity_user amenity_db
#
# Volumes:
#   postgres_data  — persists the database between docker compose restarts
#   image_storage  — persists uploaded images between API container restarts

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine  # Alpine is smaller than the default Debian image
    restart: unless-stopped
    environment:
      # These are read from your .env file (copy from .env.example)
      POSTGRES_USER: ${POSTGRES_USER:-amenity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amenity_pass}
      POSTGRES_DB: ${POSTGRES_DB:-amenity_db}
    ports:
      # Expose PostgreSQL to localhost so you can connect with psql or a DB GUI.
      # Remove this in production to avoid exposing the DB to the internet.
      - "5432:5432"
    volumes:
      # Named volume so data survives container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Docker Compose waits for this to pass before starting dependent services
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amenity_user} -d ${POSTGRES_DB:-amenity_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .               # Build context is the repo root (so COPY works)
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database connection — "db" resolves to the PostgreSQL service above via Docker DNS
      DATABASE_URL: postgresql://${POSTGRES_USER:-amenity_user}:${POSTGRES_PASSWORD:-amenity_pass}@db:5432/${POSTGRES_DB:-amenity_db}
      # Ollama — change to http://ollama:11434 if you add an Ollama service here
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IMAGE_STORAGE_DIR: /app/storage/images
    volumes:
      # Named volume for uploaded images — survives container rebuilds
      - image_storage:/app/storage/images
    depends_on:
      db:
        condition: service_healthy  # Wait until PostgreSQL is accepting connections
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gradio UI (Phase 3 — uncomment when ui/app.py is implemented) ───────────
  # ui:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.ui
  #   restart: unless-stopped
  #   ports:
  #     - "7860:7860"
  #   environment:
  #     API_BASE_URL: http://api:8000
  #   depends_on:
  #     api:
  #       condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Docker manages this volume; data persists across `docker compose down` (without -v)
  image_storage:
    # Uploaded images; also persists across restarts
